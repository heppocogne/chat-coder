name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -t . -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build pyz
        run: |
          mkdir -p build dist
          cp -r chat_coder build/chat_coder
          find build -name __pycache__ -type d -prune -exec rm -rf {} +
          rm build/chat_coder/__main__.py
          python -m zipapp build -m "chat_coder.cli:main" -p "/usr/bin/env python3" -c -o dist/chat-coder.pyz
      - name: Smoke test
        run: python dist/chat-coder.pyz --help
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/chat-coder.pyz --title "$GITHUB_REF_NAME" --generate-notes
