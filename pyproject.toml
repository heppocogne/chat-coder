[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-coder"
dynamic = ["version"]
description = "コーディングエージェントが使えない環境で、LLM チャットをエージェント代わりにする半自動ループ"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
chat-coder = "chat_coder.cli:main"

[project.optional-dependencies]
auto = [
    "pywinauto>=0.6.8",
]
edit = [
    "prompt_toolkit>=3.0",
]
dev = [
    "ruff>=0.17.0",
]

[tool.setuptools]
packages = ["chat_coder"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]

[tool.setuptools.dynamic]
version = {attr = "chat_coder.__version__"}
